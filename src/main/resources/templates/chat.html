<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Real-Time</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; }
        #chat-box { width: 400px; height: 300px; border: 1px solid #ddd; overflow-y: auto; padding: 10px; }
        .message { margin-bottom: 10px; }
        .sender { font-weight: bold; }
        .admin { color: red; }
        .customer { color: blue; }
    </style>
</head>
<body>

<h2>Chat Real-Time</h2>
<div id="chat-box"></div>
<input type="text" id="message-input" placeholder="Nhập tin nhắn..." />
<button onclick="sendMessage()">Gửi</button>

<script>
    let stompClient = null;

    // Lấy role từ URL (?role=admin hoặc ?role=customer)
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role') || 'customer'; // Mặc định là customer
    const userId = role === 'admin' ? 'Admin' : 'Customer';

    function connect() {
        let socket = new SockJS('/ws'); // Kết nối tới WebSocket endpoint
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function () {
            console.log("WebSocket Connected");

            // Lắng nghe tin nhắn từ server
            stompClient.subscribe('/topic/messages', function (message) {
                showMessage(JSON.parse(message.body));
            });
        });
    }

    function sendMessage() {
        let content = document.getElementById("message-input").value;
        if (content.trim() === "") return; // Không gửi tin nhắn rỗng

        let chatMessage = {
            sender: userId,
            content: content,
            role: role
        };

        stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
        document.getElementById("message-input").value = "";
    }

    function showMessage(message) {
        let chatBox = document.getElementById("chat-box");
        let messageClass = message.role === 'admin' ? 'admin' : 'customer';
        chatBox.innerHTML += `
            <div class="message">
                <span class="sender ${messageClass}">${message.sender}:</span>
                ${message.content}
            </div>
        `;
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    connect();
</script>

</body>
</html>
