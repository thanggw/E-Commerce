<!--css của side bar nằm ở trong file navbar.css-->
<div th:fragment="sidebar">
    <div class="sidebar">
        <div class="profile">
            <img src="/image/LionelMessi1.jpg" alt="User">
            <h3>Vũ Hoàng Phương Anh</h3>
        </div>
        <ul>
            <li th:classappend="${currentPath.startsWith('/guests/sellerchannel')} ? 'active'" id="dashboard">
                <i class="fas fa-tachometer-alt"></i>
                <a th:href="@{/guests/sellerchannel}">Trang chủ</a>
            </li>
            <li th:classappend="${currentPath.startsWith('/adminScreen/activate')} ? 'active'" id="customers">
                <i class="fas fa-users"></i>
                <a th:href="@{/adminScreen/activate}">Quản lý người dùng</a>
            </li>
            <li id="statistics" th:classappend="${currentPath.startsWith('/statistics')} ? 'active'">
                <i class="fas fa-chart-bar"></i>
                <a th:href="@{/statistics}">Thống kê</a>
            </li>

            <li class="has-submenu" th:classappend="${currentPath.startsWith('/adminScreen/productManagement')} ? 'active'">
                <i class="fas fa-box"></i>
                <a th:href="@{/adminScreen/productManagement}">Quản lý sản phẩm</a>
                <ul class="submenu">
                    <li><a href="#">Add Product</a></li>
                    <li><a href="#">Edit Product</a></li>
                </ul>
            </li>

            <li id="orders" th:classappend="${currentPath.startsWith('/adminScreen/all_order')} ? 'active'">
                <i class="fas fa-shopping-cart"></i>
                <a th:href="@{/adminScreen/all_order}">Đơn hàng</a>
            </li>

            <li id="business-hours">
                <i class="fas fa-clock"></i>
                <a href="#" onclick="openBusinessHoursModal()">Giờ hoạt động</a>
            </li>

            <li id="voucher" th:classappend="${currentPath.startsWith('/adminScreen/voucher')} ? 'active'">
                <i class="fa-solid fa-receipt"></i>
                <a th:href="@{/adminScreen/voucher}">Voucher</a>
            </li>
            <li id="logout">
                <i class="fas fa-sign-out-alt"></i>
                <a href="#">Đăng xuất</a>
            </li>
            <!-- Modal Business Hours -->
            <div id="businessHoursModal" class="modal">
                <div class="modal-content">
                    <span class="close" onclick="closeBusinessHoursModal()">&times;</span>
                    <h2>Set Business Hours</h2>
                    <label for="opening-time">Opening Time:</label>
                    <input type="time" id="opening-time">

                    <label for="closing-time">Closing Time:</label>
                    <input type="time" id="closing-time">

                    <button onclick="saveBusinessHours()">Save</button>
                </div>
            </div>
        </ul>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
