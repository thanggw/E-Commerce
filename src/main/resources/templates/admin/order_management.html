<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f4f4f4;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        select, button {
            padding: 5px;
            margin: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #3e8e41;
        }
        .container {
            max-width: 1175px;
            margin-left: 18%;
            margin-top: 40px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        option.status-pending { background-color: #fff3cd; color: orange; }
        option.status-processing { background-color: #cce5ff; color: blue; }
        option.status-shipped { background-color: #e2d4f0; color: purple; }
        option.status-delivered { background-color: #d4edda; color: green; }
        option.status-canceled { background-color: #f8d7da; color: red; }
        .status-pending { color: orange; }
        .status-processing { color: blue; }
        .status-shipped { color: purple; }
        .status-delivered { color: green; }
        .status-canceled { color: red; }
    </style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div th:replace="fragments/sidebar :: sidebar"></div>
<div class="container">
    <h3>Trang chủ / Danh sách Đơn Hàng</h3>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Giá</th>
            <th>Trạng thái</th>
            <th>Người nhận</th>
            <th>Số điện thoại</th>
            <th>Địa chỉ</th>
            <th>Cập nhật</th>
        </tr>
        </thead>
        <tbody id="orderTableBody">
        <!-- Dữ liệu sẽ được thêm ở đây -->
        </tbody>
    </table>
    <button onclick="fetchOrders()">Làm mới</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/admin-chat.js"></script>
<script>
    async function fetchOrders() {
        const response = await fetch("http://localhost:8082/api/admin/users/all-orders");
        const orders = await response.json();
        const tableBody = document.getElementById("orderTableBody");
        tableBody.innerHTML = "";

        orders.forEach(order => {
            const row = document.createElement("tr");
            const statusClass = `status-${order.orderStatus.toLowerCase()}`;
            row.innerHTML = `
                <td>${order.orderId}</td>
                <td>${order.totalPrice.toFixed(3)} VND</td>
                <td class="${statusClass}">${order.orderStatus}</td>
                <td>${order.recipientName}</td>
                <td>${order.recipientPhone}</td>
                <td>${order.recipientAddress}</td>
                <td>
                    <select onchange="updateStatus(${order.orderId}, this.value)">
                        <option class="status-pending" value="Pending" ${order.orderStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                        <option class="status-processing" value="Processing" ${order.orderStatus === 'Processing' ? 'selected' : ''}>Processing</option>
                        <option class="status-shipped" value="Shipped" ${order.orderStatus === 'Shipped' ? 'selected' : ''}>Shipped</option>
                        <option class="status-delivered" value="Delivered" ${order.orderStatus === 'Delivered' ? 'selected' : ''}>Delivered</option>
                        <option class="status-canceled" value="Canceled" ${order.orderStatus === 'Canceled' ? 'selected' : ''}>Canceled</option>
                    </select>
                </td>
            `;
            tableBody.appendChild(row);
        });
    }

    async function updateStatus(orderId, newStatus) {
        const response = await fetch(`http://localhost:8082/api/admin/users/${orderId}/status?status=${newStatus}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" }
        });
        if (response.ok) {
            alert("Cập nhật trạng thái đơn hàng thành công!");
            fetchOrders();
        } else {
            alert("Cập nhật thất bại! Vui lòng thử lại.");
        }
    }

    window.onload = fetchOrders;
</script>
</body>
</html>
